        - generic [ref=e20]:
          - generic [ref=e21]:
            - heading "About Anthropic" [level=2] [ref=e22]:
              - strong [ref=e23]: About Anthropic
            - paragraph [ref=e24]: Anthropic’s mission is to create reliable, interpretable, and steerable AI systems. We want AI to be safe and beneficial for our users and for society as a whole. Our team is a quickly growing group of committed researchers, engineers, policy experts, and business leaders working together to build beneficial AI systems.
          - generic [ref=e25]:
            - heading "About the role" [level=2] [ref=e26]
            - paragraph [ref=e27]: We are looking for software engineers to join our Platform organization. We build the foundational primitives that accelerate product development across Anthropic, and own infrastructure and systems that teams depend on to ship reliably and at scale - either internally or by hundreds of thousands of external global users and companies at all stages.
            - paragraph [ref=e28]:
              - text: This is a role for engineers who love working on hard infrastructure problems, and building systems that are reliable, scalable, and elegant. You'll help define performance quality and standard for the company, power the next gen of LLM-first products, and redefine best-in-class developer experience.
              - emphasis [ref=e29]: We have multiple teams that are currently hiring. Team placement occurs after the interview process, taking into account your interests and experience alongside organizational needs. This flexible approach allows us to match talented engineers with the platform efforts where they'll have the greatest impact and growth potential.
            - paragraph [ref=e30]:
              - strong [ref=e31]: "Platform Acceleration:"
              - text: We work on maximizing the developer productivity of product engineers at Anthropic. You'll architect and optimize the critical development infrastructure that powers our AI product development, including dev environments, observability, and CI/CD pipelines. You’ll partner closely with product teams to understand their development workflow and eliminate friction points. Your work will have an extraordinary multiplier effect, enhancing productivity across our entire product organization and accelerating our mission.
            - paragraph [ref=e32]:
              - strong [ref=e33]: "Service Infra:"
              - text: we build and maintain the core infrastructure that powers Anthropic's engineering organization, from service mesh and observability systems to deployment pipelines and shared libraries. Our work enables product teams to build and operate reliable services at scale, making us a critical force multiplier across the entire company.
            - paragraph [ref=e34]:
              - strong [ref=e35]: "Multicloud:"
              - text: We build and maintain the infrastructure that enables Anthropic to operate across multiple cloud providers. We focus on cloud-agnostic tooling, cross-cloud networking, and multi-region deployments.
            - paragraph [ref=e36]:
              - strong [ref=e37]: "Connectivity:"
              - text: "Our mission is to make Claude the most connected AI. We own the MCP proxy that routes every tool call and the OAuth and token management that keeps connections authenticated. We're also the core contributors to the MCP spec — now an open standard under the Linux Foundation — and maintain the official Python and TypeScript SDKs. You'll work on problems where reliability and enterprise trust are the bar: token refresh at scale, admin controls that let IT govern what agents can do, proxy infrastructure that stays up when partner servers don't. We ship for claude.ai, Claude Code, Cowork, and the API. Relevant experience includes OAuth, API gateways, multi-tenant platforms, building for enterprise, and MCP."
            - paragraph [ref=e38]:
              - strong [ref=e39]: "API Distributability:"
              - text: "The Claude API today is a rapidly growing platform serving developers and enterprises at scale—but reaching the next tier of enterprise customers requires transforming how and where we deploy it. The Distributability team owns that transformation: making the Claude API a cloud-native, managed product that runs wherever our customers need it, cross-cloud and on Anthropic's own infrastructure, with the enterprise-grade security, compliance, and operational capabilities to support it."
            - paragraph [ref=e40]:
              - strong [ref=e41]: "Platform Intelligence:"
              - text: "We build the training systems that adapt Claude to specific customer workloads. The core problem is task-specific adaptation: getting the right intelligence, cost, and latency profile for a particular use case, and building toward systems where that adaptation can deepen as the customer's usage grows. We work closely with research on training methods and with agent platform teams on data paths. Relevant experience: ML training infra, production ML pipelines, backend engineering. Finetuning experience is a plus."
            - heading "You might be a good fit if you:" [level=2] [ref=e42]:
              - strong [ref=e43]: "You might be a good fit if you:"
            - list [ref=e44]:
              - listitem [ref=e45]: Have a minimum of 6 years of practical experience building backend product or platform systems—distributed systems, cloud-native products, developer tools, or external developer facing products
              - listitem [ref=e46]: Have strong fundamentals in service-oriented architectures, networking, and systems design
              - listitem [ref=e47]: Are proficient in Python, Go, Rust, or similar systems languages
              - listitem [ref=e48]: Have experience with cloud infrastructure (GCP, AWS, or Azure), container orchestration (Kubernetes), and/or multi-cloud networking
              - listitem [ref=e49]: Take full ownership of your work—from design through deployment and operations
              - listitem [ref=e50]: Can navigate ambiguity and make sound technical decisions independently, and have ideally operated in 0 to 1 and more mature team or company settings
              - listitem [ref=e51]: Take a product-focused approach to platform work and care about building solutions that are robust, scalable, and easy to use
              - listitem [ref=e52]: Care about building systems that other engineers love to use
            - paragraph [ref=e53]:
              - strong [ref=e54]: "Deadline to apply:"
              - text: None. Applications will be reviewed on a rolling basis.
            - paragraph [ref=e55]:
              - strong [ref=e56]: "Location Preference:"
              - text: Preference will be given to candidates based in NY, SEA, SF or the Bay Area given the current location of team.
