                - generic [ref=e568]: Life at Walmart
                - generic [ref=e571]: Imagine a workplace surrounded by innovation. At Walmart’s new Home Office in Bentonville, Arkansas, we’re redefining what it means to work at a global leader.
                - generic [ref=e575]:
                  - generic [ref=e578]: Set on 350 acres of thoughtfully revitalized land, our new campus seamlessly integrates the charm of Northwest Arkansas with cutting edge design and technology. From biking trails and outdoor courtyards to flexible, tech-enabled workspaces, every detail reflects our commitment to sustainability, connection, and culture.
                  - img "JobDetailsLifeAtSubHeadingWithContent-image-rpane" [ref=e580]
                - generic [ref=e584]:
                  - generic [ref=e587]:
                    - text: With amenities like on-site childcare at our Little Squiggles Children’s Enrichment Center, the Walton Family Whole Health & Fitness Center, and a vibrant food hall featuring local and international favorites, we’re creating a space where work-life balance isn’t just a goal—it’s a reality.
                    - text: Beyond the campus, Bentonville offers a dynamic lifestyle with world-class dining, art at the Crystal Bridges Museum, and countless outdoor activities.
                  - img "JobDetailsLifeAtSubHeadingWithContent-image-rpane" [ref=e589]
                - generic [ref=e594]: Whether you’re exploring High South cuisine, enjoying live performances at our new amphitheater, or cycling the Razorback Greenway, you’ll experience the perfect blend of small-town charm and big-city amenities.
