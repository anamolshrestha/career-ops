                    - generic [ref=e245]: This is a full-time, onsite role at our Sunnyvale, CA office. This position is not eligible for remote work.
                    - text: "Role Summary:"
                    - text: We are seeking a talented and passionate Senior, Software Engineer (Backend) for our team. You will be part of Catalog Spec Engineering team and will be responsible for developing high performance and scalable catalog service that meet the needs of millions of Walmart customers. We are looking to bring more intellectually curious engineers who are passionate about technology in general.
                    - text: "About the Team:"
                    - text: Join the innovative Walmart Catalog team, where creativity and technological innovation drive success. We specialize in enhancing seller and supplier experiences in setting up their catalog and managing catalog platform. Our tech stack includes Java for backend services, providing an exciting opportunity for growth and collaboration. Our Catalog Spec Engineering team has built the next generation platform where you’ll independently handle high impact, critical software/systems monitoring issues, troubleshoot business and production issues. As a member of this fast-moving and highly entrepreneurial team, you’ll be able to say that you work for the world’s largest retailer and contribute to innovation and development to best-in-class methodologies that impacted perception and drastically changed business as we know it.
                    - text: "What You'll Do:"
                    - list [ref=e246]:
                      - listitem [ref=e247]: Design & develop highly scalable services and solve complex software system problems by leveraging state-of-the-art technology and enhance Walmart catalog and partner experience solutions.
                      - listitem [ref=e248]: Troubleshoot business and production issues by gathering information and engaging support teams to resolve issues.
                      - listitem [ref=e249]: Perform root cause analysis to prevent future occurrence of issues and ensure compliance with Walmart code of conduct.
                      - listitem [ref=e250]: Provide technical guidance and mentorship to junior team members to ensure compliance with Walmart code of conduct.
                      - listitem [ref=e251]: Work in an agile environment, adhering to best practices and collaborating with teams to deliver results.
                      - listitem [ref=e252]: Stay up to date with the latest GenAI trends and technologies and contribute to the development of innovative solutions that improve the seller and supplier experience on our catalog platform.
                      - listitem [ref=e253]: Participate in medium- to large-scale, complex, cross-functional projects ensuring on-time delivery.
                    - text: "What You'll Bring:"
                    - list [ref=e254]:
                      - listitem [ref=e255]: 6-8 years of experience as a Sr. Software Engineer.
                      - listitem [ref=e256]: Expert-level knowledge of Java and experience building Java-based backend systems.
                      - listitem [ref=e257]: Extensive experience building and implementing microservices and applications using SpringBoot and reactive frameworks like Spring WebFlux.
                      - listitem [ref=e258]: Experience in internet-scale distributed technologies (e.g. Solr, Kafka, Mem Cache, etc.).
                      - listitem [ref=e259]: Strong understanding of JEE components, multithreading, and networking.
                      - listitem [ref=e260]: Extensive knowledge of offline storage, caching, and performance tuning.
                      - listitem [ref=e261]: Experience with cloud-based solutions and hands-on experience with CI/CD development environments/tools, including Git, Maven, and Jenkins.
                      - listitem [ref=e262]: Strong understanding of CS fundamentals, microservices, data structures, algorithms, and problem solving.
                      - listitem [ref=e263]: Experience working with generated AI/ML technologies.
                      - listitem [ref=e264]: Experience with NoSQL databases like Cosmos DB, Cassandra and ability to design and implement scalable data models.
                    - heading [level=2]
                    - text: "About Walmart Global Tech:"
                    - text: Imagine working in an environment where one line of code can make life easier for hundreds of millions of people. That's what we do at Walmart Global Tech. We're a team of software engineers, data scientists, cybersecurity experts and service professionals within the world's leading retailer who make an epic impact and are at the forefront of the next retail disruption. People are why we innovate, and people power our innovations. We are people-led and tech-empowered. We train our team in the skillsets of the future and bring in experts like you to help us grow. We have roles for those chasing their first opportunity as well as those looking for the opportunity that will define their career. Here, you can kickstart a great career in tech, gain new skills and experience for virtually every industry, or leverage your expertise to innovate at scale, impact millions and reimagine the future of retail.
                    - text: Walmart’s culture is a competitive advantage, and it’s fostered by being together. Working together in person allows us to collaborate, align quickly and innovate with greater speed. We use our campuses to create purposeful connections rooted in deepening understanding and investing in the development of our associates.
                    - text: "Benefits:"
                    - text: Beyond our great compensation package, you can receive incentive awards for your performance. Other great perks include 401(k) match, stock purchase plan, paid maternity and parental leave, PTO, multiple health plans, and much more.
                    - text: "Equal Opportunity Employer:"
                    - text: Walmart, Inc. is an Equal Opportunity Employer - by choice. We believe we are best equipped to help our associates, customers, and the communities we serve live better when we really know them. That means understanding, respecting, and valuing unique styles, experiences, identities, ideas and opinions while being welcoming of all people.
                    - text: The above information has been designed to indicate the general nature and level of work performed in the role. It is not designed to contain or be interpreted as a comprehensive inventory of all responsibilities and qualifications required of employees assigned to this job. The full job description can be made available as part of the hiring process.
                    - text: "#LI-onsite"
                    - text: At Walmart, we offer competitive pay as well as performance-based bonus awards and other great benefits for a happier mind, body, and wallet. Health benefits include medical, vision and dental coverage. Financial benefits include 401(k), stock purchase and company-paid life insurance. Paid time off benefits include PTO (including sick leave), parental leave, family care leave, bereavement, jury duty, and voting. Other benefits include short-term and long-term disability, company discounts, Military Leave Pay, adoption and surrogacy expense reimbursement, and more. You will also receive PTO and/or PPTO that can be used for vacation, sick leave, holidays, or other purposes. The amount you receive depends on your job classification and length of employment. It will meet or exceed the requirements of paid sick leave laws, where applicable. For information about PTO, see
                    - link "https://one.walmart.com/notices" [ref=e266] [cursor=pointer]:
                      - /url: https://one.walmart.com/notices
                    - text: . Live Better U is a Walmart-paid education benefit program for full-time and part-time associates in Walmart and Sam's Club facilities. Programs range from high school completion to bachelor's degrees, including English Language Learning and short-form certificates. Tuition, books, and fees are completely paid for by Walmart.
                    - text: Eligibility requirements apply to some benefits and may depend on your job classification and length of employment. Benefits are subject to change and may be subject to a specific plan or program terms.
                    - text: For information about benefits and eligibility, see
                    - link "One.Walmart" [ref=e267] [cursor=pointer]:
                      - /url: https://one.walmart.com/
