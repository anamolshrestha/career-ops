<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAME}} -- CV</title>
<style>
  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-latin.woff2') format('woff2');
    font-weight: 100 1000;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-latin-ext.woff2') format('woff2');
    font-weight: 100 1000;
    font-style: normal;
    font-display: swap;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    font-family: 'DM Sans', Calibri, 'Segoe UI', Arial, sans-serif;
    font-size: 10.5px;
    line-height: 1.45;
    color: #000;
    background: #ffffff;
    padding: 40px 52px;
    margin: 0;
  }

  .page {
    width: 100%;
    max-width: {{PAGE_WIDTH}};
    margin: 0 auto;
  }

  /* === HEADER === */
  h1 {
    font-size: 24px;
    font-weight: 700;
    color: #000;
    margin-bottom: 2px;
    line-height: 1.15;
  }

  .contact-row {
    font-size: 10px;
    color: #333;
    margin-bottom: 14px;
  }

  .contact-row a {
    color: #333;
    text-decoration: none;
  }

  .contact-row .separator {
    margin: 0 5px;
  }

  /* === SECTIONS === */
  .section {
    margin-bottom: 12px;
  }

  .section-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #000;
    border-bottom: 1.5px solid #000;
    padding-bottom: 2px;
    margin-bottom: 7px;
    line-height: 1.2;
  }

  /* === PROFESSIONAL SUMMARY === */
  .summary-text {
    font-size: 10.5px;
    line-height: 1.55;
    color: #000;
  }

  /* Links must never break across lines */
  a {
    white-space: nowrap;
  }

  /* === WORK EXPERIENCE === */
  .job {
    margin-bottom: 10px;
  }

  .job-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }

  .job-company {
    font-size: 11px;
    font-weight: 700;
    color: #000;
  }

  .job-period {
    font-size: 10.5px;
    color: #000;
    white-space: nowrap;
  }

  .job-role-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 3px;
  }

  .job-role {
    font-size: 10.5px;
    font-style: italic;
    color: #000;
  }

  .job-location {
    font-size: 10.5px;
    color: #000;
    white-space: nowrap;
  }

  .job ul {
    padding-left: 16px;
    list-style-type: disc;
    margin-top: 1px;
  }

  .job li {
    font-size: 10.5px;
    line-height: 1.5;
    color: #000;
    margin-bottom: 2px;
  }

  .job li strong {
    font-weight: 700;
  }

  /* === PROJECTS === */
  .project {
    margin-bottom: 10px;
  }

  .project-title {
    font-size: 11px;
    font-weight: 700;
    color: #000;
  }

  .project-desc {
    font-size: 10.5px;
    color: #000;
    margin-top: 2px;
    line-height: 1.5;
  }

  .project-tech {
    font-size: 10px;
    color: #333;
    margin-top: 2px;
    font-style: italic;
  }

  /* === EDUCATION === */
  .edu-item {
    margin-bottom: 6px;
  }

  .edu-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }

  .edu-org {
    font-size: 11px;
    font-weight: 700;
    color: #000;
  }

  .edu-year {
    font-size: 10.5px;
    color: #000;
    white-space: nowrap;
  }

  .edu-title {
    font-size: 10.5px;
    color: #000;
    margin-top: 1px;
  }

  .edu-desc {
    font-size: 10px;
    color: #333;
    margin-top: 2px;
    line-height: 1.5;
  }

  /* === CERTIFICATIONS === */
  .cert-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 5px;
  }

  .cert-title {
    font-size: 10.5px;
    font-weight: 500;
    color: #000;
  }

  .cert-org {
    font-size: 10.5px;
    color: #333;
  }

  .cert-year {
    font-size: 10.5px;
    color: #000;
    white-space: nowrap;
  }

  /* === SKILLS === */
  .skills-grid {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .skill-row {
    font-size: 10.5px;
    color: #000;
    line-height: 1.5;
  }

  .skill-category {
    font-weight: 700;
    color: #000;
  }

  /* === PRINT === */
  @media print {
    body {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      padding: 0;
    }
  }

  /* === PAGE BREAK CONTROL === */
  .avoid-break,
  .job,
  .project,
  .edu-item,
  .cert-item {
    break-inside: avoid;
    page-break-inside: avoid;
  }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER: name, contact row, then section content begins -->
  <h1>{{NAME}}</h1>
  <div class="contact-row">{{LOCATION}}<span class="separator">&bull;</span>{{PHONE}}<span class="separator">&bull;</span><span>{{EMAIL}}</span><span class="separator">&bull;</span><a href="{{LINKEDIN_URL}}">{{LINKEDIN_DISPLAY}}</a></div>

  <!-- PROFESSIONAL SUMMARY -->
  <div class="section avoid-break">
    <div class="section-title">{{SECTION_SUMMARY}}</div>
    <div class="summary-text">{{SUMMARY_TEXT}}</div>
  </div>

  <!-- WORK EXPERIENCE -->
  <div class="section">
    <div class="section-title">{{SECTION_EXPERIENCE}}</div>
    {{EXPERIENCE}}
  </div>

  <!-- PROJECTS (omit section if no projects) -->
  {{PROJECTS_SECTION}}

  <!-- EDUCATION -->
  <div class="section avoid-break">
    <div class="section-title">{{SECTION_EDUCATION}}</div>
    {{EDUCATION}}
  </div>

  <!-- CERTIFICATIONS (omit section if no certifications) -->
  {{CERTIFICATIONS_SECTION}}

  <!-- SKILLS -->
  <div class="section avoid-break">
    <div class="section-title">{{SECTION_SKILLS}}</div>
    <div class="skills-grid">
      {{SKILLS}}
    </div>
  </div>

</div>
</body>
</html>
